<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>

  <!-- macOS icon tile: 824pt squircle centred on the 1024 canvas, pure black -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#000" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>

  <!-- neon o: blurred glow, the gradient tube, then its bright core -->
  <circle cx="512" cy="512" r="232" fill="none" stroke="url(#neon)" stroke-width="120" opacity="0.75" filter="url(#glow)"/>
  <circle cx="512" cy="512" r="232" fill="none" stroke="url(#neon)" stroke-width="112"/>
  <circle cx="512" cy="512" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10"/>

  <!-- hairline edge so the black tile stays visible on a dark Dock -->
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="4"/>
</svg>
