[package]
name = "omux"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Run many Claude Code and Codex sessions side by side"
license = "MIT"
repository = "https://github.com/onurozcan/omux"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
vte = { package = "vte4", version = "0.10", features = ["v0_76"] }
async-channel = "2"
libc = "0.2"
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
ureq = "3"
uuid = { version = "1", features = ["v4", "serde"] }
webkit6 = { version = "0.6", features = ["v2_42"] }

[package.metadata.deb]
name = "omux"
maintainer = "omux contributors"
copyright = "2026, Onur Özcan"
section = "devel"
depends = "libgtk-4-1 (>= 4.14), libadwaita-1-0 (>= 1.5), libvte-2.91-gtk4-0 (>= 0.76), libwebkitgtk-6.0-4, git"
recommends = "gh, libcanberra-gtk3-module"
extended-description = "Run many Claude Code and Codex sessions side by side, with live agent status, worktrees and pull request status."
assets = [
    ["target/release/omux", "usr/bin/", "755"],
    ["data/net.pf1.omux.desktop", "usr/share/applications/", "644"],
    ["data/net.pf1.omux.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/net.pf1.omux.metainfo.xml", "usr/share/metainfo/", "644"],
]

[profile.release]
lto = "thin"
strip = true
